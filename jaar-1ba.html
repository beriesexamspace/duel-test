    (() => {
      let keuze;
      try { keuze = window.localStorage.getItem('bes_thema'); } catch {}
      const donker = keuze === 'donker' || (keuze !== 'licht' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = donker ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = donker ? '#0B0B0C' : '#FFFFFF';
    })();
  </script>

  <main id="inhoud" class="pagina" aria-labelledby="jaar-titel">
    <div class="wrap">
      <a class="terug" href="hub.html" data-terug="hub.html" data-terug-tekst="Terug">← Terug</a>

      <header class="pagina-kop">
        <h1 id="jaar-titel">1ste bachelor</h1>
        <p id="jaar-sub">Kies een vak om te oefenen.</p>
      </header>

      <section aria-label="Vakken van dit jaar">
        <div class="rooster-2" id="vakken"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p class="footer-brand">Berie's Exam Space</p>
    <div class="footer-details">
      <p>Duidelijk leren. Rustig groeien.</p>
      <p class="project-label">Een project van The Berie Foundation</p>
    </div>
  </footer>

  <script>
    (() => {
      const bes = window.BES || {};
      const jaar = document.body.dataset.jaar;
      const lijst = document.getElementById('vakken');
      const sub = document.getElementById('jaar-sub');
      const vakken = typeof bes.vakkenVanJaar === 'function' ? bes.vakkenVanJaar(jaar) : [];

      if (typeof bes.jaarOpslaan === 'function') bes.jaarOpslaan(jaar);

      if (!vakken.length) {
        lijst.innerHTML = '<p class="leeg">Voor dit jaar staan nog geen vakken klaar.</p>';
        return;
      }

      sub.textContent = vakken.length + ' vakken. Kies er een om te oefenen.';

      vakken.forEach((vak, index) => {
        const kaart = document.createElement('a');
        kaart.className = 'kaart kaart-pijl vak';
        kaart.href = bes.vakLink(vak, '');
        kaart.style.animationDelay = Math.min(index * 45, 540) + 'ms';

        const tekst = document.createElement('span');
        tekst.className = 'kaart-tekst';

        const titel = document.createElement('span');
        titel.className = 'kaart-titel';
        titel.textContent = vak.naam;

        const uitleg = document.createElement('span');
        uitleg.className = 'kaart-sub';
        uitleg.textContent = vak.tekst;

        tekst.append(titel, uitleg);

        const pijl = document.createElement('span');
        pijl.className = 'pijl';
        pijl.setAttribute('aria-hidden', 'true');
        pijl.textContent = '→';

        kaart.append(tekst, pijl);
        lijst.append(kaart);
      });
    })();
  </script>
</body>
