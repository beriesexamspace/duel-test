<style>
  *{margin:0;padding:0}
  html{scroll-behavior:smooth}
  :focus-visible{border-radius:6px}
  .startpagina{isolation:isolate}

  /* Hero */
  .hero{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:clamp(12px,3vh,32px) 24px clamp(12px,2.5vh,24px);
    text-align:center;
  }
  .sig{
    display:block;
    width:min(86vw,1100px,140vh);
    height:auto;
    margin:0 auto -6%;
    opacity:.95;
    pointer-events:none;
  }
  .sig path{fill:none;stroke:var(--sig);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .sig .krul{stroke-width:7}
  .sig .verbinding{stroke-width:6}
  .hero-in{
    position:relative;z-index:1;
    max-width:1260px;
    opacity:0;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) .05s forwards;
  }
  h1{
    font-size:clamp(3rem,min(8.3vw,14vh),7.25rem);
    font-weight:700;
    line-height:1.02;
    text-wrap:balance;
  }
  h1 .r1{display:block;color:var(--ink)}
  h1 .r2{display:block;color:var(--grey-title)}
  .lead{
    color:var(--ink-soft);
    font-size:clamp(1.1rem,1.8vw,1.55rem);
    line-height:1.5;
    max-width:48rem;
    margin:clamp(14px,2.6vh,24px) auto 0;
  }
  .cta{
    margin-top:clamp(20px,4vh,36px);
    opacity:0;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) .2s forwards;
  }
  .account-options,.account-session{display:flex;flex-direction:column;align-items:center;gap:14px}
  .cta .knop{min-height:56px;padding-inline:36px;font-size:1.125rem}
  .cta .tekstlink{font-size:1.0625rem}
  .account-session{max-width:34rem;margin:0 auto}

  @media (max-width:768px){
    .hero{padding:clamp(16px,3vh,28px) 20px clamp(12px,2.5vh,20px)}
    .sig{width:98vw;opacity:.9;margin-bottom:-4%}
    .lead{font-size:1.1rem}
    .cta .knop{min-height:52px;font-size:1.0625rem}
  }
  @media (prefers-reduced-motion:reduce){
    .hero-in,.cta{animation:none;opacity:1}
    html{scroll-behavior:auto}
  }
</style>
</head>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var paden = Array.prototype.slice.call(document.querySelectorAll('.sig path'));
  var lens = paden.map(function(p){ return p.getTotalLength(); });
  var total = lens.reduce(function(a,b){ return a+b; }, 0);

  paden.forEach(function(p,i){
    p.style.strokeDasharray = lens[i] + ' ' + lens[i];
    p.style.strokeDashoffset = reduce ? 0 : lens[i];
  });
  if (reduce) return;

  var SCHRIJF = 5000, STIL = 2200, WIS = 3200, LEEG = 900, LIFT = 45;
  var anims = [];

  function schrijf(){
    anims.forEach(function(a){ a.cancel(); }); anims = [];
    var t = 0;
    paden.forEach(function(p,i){
      var d = SCHRIJF * lens[i] / total;
      anims.push(p.animate([{strokeDashoffset: lens[i]}, {strokeDashoffset: 0}],
        {duration: d, delay: t, easing: 'linear', fill: 'both'}));
      t += d + LIFT;
    });
    setTimeout(wis, t + STIL);
  }
  function wis(){
    var t = 0;
    for (var i = paden.length - 1; i >= 0; i--) {
      var d = WIS * lens[i] / total;
      anims.push(paden[i].animate([{strokeDashoffset: 0}, {strokeDashoffset: lens[i]}],
        {duration: d, delay: t, easing: 'linear', fill: 'both'}));
      t += d + LIFT;
    }
    setTimeout(schrijf, t + LEEG);
  }
  setTimeout(schrijf, 400);
})();
</script>
