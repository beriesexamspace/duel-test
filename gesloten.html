    (() => {

      try { keuze = window.localStorage.getItem('bes_thema'); } catch {}
      const donker = keuze === 'donker' || (keuze !== 'licht' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = donker ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = donker ? '#0B0B0C' : '#FFFFFF';
    })();
  </script>

  <script>
    // Is de site intussen open, of mag dit account wel binnen (toegang gekregen), dan meteen naar de hub.
    // Zo blijft niemand op deze pagina hangen.
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = window.BES && window.BES.auth;
      if (!auth) return;
      try { await auth.gereed; } catch {}
      if (!auth.client) return;
      try {
        const open = await auth.client.rpc('site_open');
        if (!open.error && open.data === true) { window.location.replace('/hub.html'); return; }
        const gebruiker = await auth.gebruiker();
        if (!gebruiker) return;
        const toegang = await auth.client.rpc('heeft_toegang');
        if (!toegang.error && toegang.data === true) window.location.replace('/hub.html');
      } catch {}
    });
  </script>
